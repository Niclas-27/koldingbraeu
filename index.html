<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Koldingbräu Braubuch</title>
<meta name="description" content="Das Braubuch von Koldingbräu – unsere Sude mit Schüttung, Hopfen, Hefe und Messwerten.">
<meta name="theme-color" content="#1f1a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="braubuch.css">
<script src="vendor/supabase.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Kolding<span>bräu</span></h1>
      <p id="subtitle">Das Braubuch</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="exportBtn" hidden>Als CSV sichern</button>
      <button class="btn" id="adminBtn" hidden>Verwaltung</button>
      <button class="btn primary" id="newBtn" hidden>+ Neuer Sud</button>
      <button class="btn" id="loginBtn" hidden>Anmelden</button>
      <button class="btn ghost who" id="accountBtn" hidden title="Mein Konto"></button>
    </div>
  </header>

  <section class="overview" id="overview" aria-label="Überblick">
    <div class="stats" id="stats">
      <div class="stat"><b>–</b><span>Sude</span></div>
      <div class="stat"><b>–</b><span>kg Malz verbraut</span></div>
      <div class="stat"><b>–</b><span>Flaschen notiert</span></div>
      <div class="stat"><b>–</b><span>Jahrgänge</span></div>
    </div>
    <div class="chart" id="chartBox" hidden>
      <div class="chart-head"><h2>Notenverlauf</h2><small>1 = sehr gut</small></div>
      <div id="chart"></div>
    </div>
  </section>

  <section class="controls" aria-label="Filter">
    <input class="search" id="q" type="search" placeholder="Suchen: Malz, Hopfen, Hefe …" aria-label="Sude durchsuchen">
    <select class="sort" id="sort" aria-label="Sortierung">
      <option value="neu">Neueste zuerst</option>
      <option value="alt">Älteste zuerst</option>
      <option value="note">Beste Note zuerst</option>
    </select>
    <div class="chips" id="chips"></div>
  </section>

  <div id="notice" class="notice" hidden></div>
  <main id="list"><p class="empty">Die Sude werden geladen …</p></main>

  <footer class="foot">
    <span>Koldingbräu · Hobbybrauerei in Hamburg</span>
    <nav><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></nav>
  </footer>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="btn ghost" id="closeBtn" aria-label="Schließen">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</aside>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
