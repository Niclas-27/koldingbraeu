# Veröffentlicht das Braubuch auf GitHub Pages.
# Holt dabei Supabase-Bibliothek und Schriften, damit die Seite nichts von fremden Servern lädt.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bibliothek und Schriften holen
        run: bash scripts/assets.sh
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp *.html .nojekyll _site/
          cp -r core features lib fonts vendor _site/
          # nur ausliefern, was der Browser braucht (keine Beschreibungen, keine SQL-Dateien)
          find _site/core _site/features -type f ! -name '*.js' ! -name '*.css' -delete
          find _site -type d -empty -delete
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
